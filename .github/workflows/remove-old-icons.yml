name: remove-old-icons
on:
  push:
    paths: ['.github/workflows/remove-old-icons.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the old per-theme icons (the app now uses one black/white icon)
        run: |
          git rm -f --ignore-unmatch \
            icons/icon-graphite-180.png \
            icons/icon-graphite-192.png \
            icons/icon-graphite-512.png \
            icons/icon-burgundy-180.png \
            icons/icon-burgundy-192.png \
            icons/icon-burgundy-512.png \
            icons/icon-ocean-180.png \
            icons/icon-ocean-192.png \
            icons/icon-ocean-512.png \
            icons/icon-emerald-180.png \
            icons/icon-emerald-192.png \
            icons/icon-emerald-512.png \
            icons/icon-coral-180.png \
            icons/icon-coral-192.png \
            icons/icon-coral-512.png \
            icons/icon-violet-180.png \
            icons/icon-violet-192.png \
            icons/icon-violet-512.png \
            icons/icon-rose-180.png \
            icons/icon-rose-192.png \
            icons/icon-rose-512.png \
            icons/icon-amber-180.png \
            icons/icon-amber-192.png \
            icons/icon-amber-512.png \
            icons/icon-mint-180.png \
            icons/icon-mint-192.png \
            icons/icon-mint-512.png \
            icon-mint-180.png \
            icon-mint-192.png \
            icon-mint-512.png \
            manifest-mint.webmanifest \
            .github/workflows/remove-old-icons.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Remove old per-theme app icons"
          git push
