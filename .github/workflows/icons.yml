name: Generate PNG icons

on:
  push:
    paths:
      - 'icons/icon.svg'
      - 'icons/part*.txt'
      - '.github/workflows/icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install Pillow
      - name: Assemble icon.svg from parts
        run: |
          cat icons/part1.txt icons/part2.txt icons/part3.txt > icons/icon.svg
          rm icons/part1.txt icons/part2.txt icons/part3.txt
      - name: Extract embedded image and render PNG icons
        run: |
          python3 - <<'EOF'
          import base64, re, io
          from PIL import Image
          svg = open('icons/icon.svg', encoding='utf-8').read()
          m = re.search(r'base64,([A-Za-z0-9+/=]+)', svg)
          assert m, 'no embedded base64 image found'
          data = base64.b64decode(m.group(1))
          im = Image.open(io.BytesIO(data)).convert('RGBA')
          for s in (180, 192, 512):
              im.resize((s, s), Image.LANCZOS).save(f'icons/icon-{s}.png')
          EOF
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-180.png icons/icon-192.png icons/icon-512.png
          git diff --staged --quiet || git commit -m "chore: generate PNG icons from SVG"
          git push
