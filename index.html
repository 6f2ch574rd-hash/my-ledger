/* ---------- 玻璃強度（滑桿）與傾斜高光 ---------- */
function applyGlassLevel(){
  const L=Math.max(0,Math.min(100,Number(settings.glassLevel??50))),r=document.documentElement.style;
  r.setProperty('--ga',(0.84-L*0.0058).toFixed(3));r.setProperty('--gad',(0.8-L*0.0058).toFixed(3));r.setProperty('--gblur',(10+L*0.3).toFixed(1)+'px');
}
/* 導航玻璃感：越往右越清透（背景更透、模糊更少、邊緣反光更亮），像 iOS 26 的 Liquid Glass */
function applyNavGlass(){
  const L=Math.max(0,Math.min(100,Number(settings.navGlass??60))),r=document.documentElement.style;
  r.setProperty('--nav-a',(0.8-L*0.0064).toFixed(3));r.setProperty('--nav-blur',(3+(100-L)*0.2).toFixed(1)+'px');r.setProperty('--nav-rim',(0.55+L*0.0045).toFixed(3));
}
let tiltOn=false,tiltRAF=0,tiltVals=null;
function setLight(x,y,ang){tiltVals={x,y,ang};if(tiltRAF)return;tiltRAF=requestAnimationFrame(()=>{tiltRAF=0;const r=document.documentElement.style,v=tiltVals;
  r.setProperty('--lx',v.x.toFixed(1)+'%');r.setProperty('--ly',v.y.toFixed(1)+'%');r.setProperty('--rim-a',v.ang.toFixed(0)+'deg');});}
function onOrient(e){if(e.gamma==null)return;const g=Math.max(-40,Math.min(40,e.gamma)),b=Math.max(0,Math.min(90,e.beta||45));
  setLight(50+g*1.6,(b-45)*1.4,135+g*1.4);}
function onPointerLight(e){if(e.pointerType!=='mouse')return;setLight(e.clientX/innerWidth*100,e.clientY/innerHeight*60-10,110+e.clientX/innerWidth*50);}
async function startTilt(fromUser){
  if(tiltOn)return true;
  if(fromUser&&window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
    const fine=!!(window.matchMedia&&matchMedia('(pointer: fine)').matches);
    try{const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'&&!fine){toast('沒有取得動作感測權限');return false;}}catch(e){if(!fine){toast('需要在 Safari 允許「動作與方向」');return false;}}
  }
  window.addEventListener('deviceorientation',onOrient);window.addEventListener('pointermove',onPointerLight,{passive:true});tiltOn=true;return true;
}
function stopTilt(){window.removeEventListener('deviceorientation',onOrient);window.removeEventListener('pointermove',onPointerLight);tiltOn=false;
  const r=document.documentElement.style;['--lx','--ly','--rim-a'].forEach(v=>r.removeProperty(v));}

/* ---------- 玻璃滑桿元件 ---------- */
const GLASS_IC_L=`<svg class="gs-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" fill="currentColor" opacity=".55"/></svg>`;
const GLASS_IC_R=`<svg class="gs-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 9.5c.6-1.3 1.7-2 3-2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>`;
function sliderHTML(key,val,label){
  return `<div class="gslider" data-gs="${key}" role="slider" tabindex="0" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${val}" style="--v:${val}">${GLASS_IC_L}<div class="gs-track"><div class="gs-fill"></div><div class="gs-knob"></div></div>${GLASS_IC_R}</div>`;
}
const SLIDERS={glassLevel:{get:()=>Number(settings.glassLevel??50),set:v=>{settings.glassLevel=v;applyGlassLevel();},label:v=>v<34?'較霧':v<67?'適中':'較透明'},
  navGlass:{get:()=>Number(settings.navGlass??60),set:v=>{settings.navGlass=v;applyNavGlass();},label:v=>v<34?'霧面':v<67?'玻璃':'清透'}};
function sliderSet(el,v,save){
  const S=SLIDERS[el.dataset.gs];if(!S)return;v=Math.max(0,Math.min(100,Math.round(v)));const old=S.get();
  if(Math.floor(old/10)!==Math.floor(v/10)||(v===0||v===100)&&old!==v)haptic();
  el.style.setProperty('--v',v);el.setAttribute('aria-valuenow',v);S.set(v);
  const lab=el.closest('.srow')&&qs('.top span',el.closest('.srow'));if(lab)lab.textContent=S.label(v);
  if(save)saveSettings();
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.gslider');if(!el)return;
  e.preventDefault();const tr=qs('.gs-track',el);
  const at=x=>{const r=tr.getBoundingClientRect();return (x-r.left-20)/(r.width-40)*100;};
  const x0=e.clientX;el.classList.add('active');el.classList.remove('scrub');sliderSet(el,at(e.clientX),false);
  const mv=ev=>{if(Math.abs(ev.clientX-x0)>3)el.classList.add('scrub');sliderSet(el,at(ev.clientX),false);};
  const up=()=>{el.classList.remove('active','scrub');saveSettings();window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
});
document.addEventListener('keydown',e=>{
  const el=e.target.closest&&e.target.closest('.gslider');if(!el)return;const S=SLIDERS[el.dataset.gs];if(!S)return;
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();sliderSet(el,S.get()+5,true);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();sliderSet(el,S.get()-5,true);}
});

/* ---------- 密碼鎖 ---------- */
let passMode=null,passBuf='',passFirst=null,passResolve=null,hiddenAt=0;
const PADL={'2':'ABC','3':'DEF','4':'GHI','5':'JKL','6':'MNO','7':'PQRS','8':'TUV','9':'WXYZ'};
function drawLockPad(){
  const faceOK=passMode==='unlock'&&settings.bio&&settings.bioCred&&bioSupported();
  const keys=['1','2','3','4','5','6','7','8','9',passMode==='set'?'cancel':(faceOK?'face':''),'0','del'];
  $('lockPad').innerHTML=keys.map(k=>{
    if(!k)return '<span></span>';
    if(k==='cancel')return '<button class="pk txt" data-pk="cancel">取消</button>';
    if(k==='face')return '<button class="pk txt" data-pk="face">Face ID</button>';
    if(k==='del')return '<button class="pk txt" data-pk="del">刪除</button>';
    return `<button class="pk" data-pk="${k}" aria-label="${k}"><b>${k}</b>${PADL[k]?`<small>${PADL[k]}</small>`:k==='1'?'<small>&nbsp;</small>':''}</button>`;
  }).join('');
}
function drawDots(){qsa('#lockDots i').forEach((d,i)=>d.classList.toggle('f',i<passBuf.length));}
function passFlow(mode){
  passMode=mode;passBuf='';passFirst=null;
  $('lockTitle').textContent=mode==='unlock'?'輸入密碼':'輸入新的 4 位數密碼';
  drawLockPad();drawDots();$('lockIcon').innerHTML=iconSVG(accentHex());$('lock').classList.add('show');
  return new Promise(r=>{passResolve=r;});
}
function endLock(v){$('lock').classList.remove('show');const r=passResolve;passResolve=null;passMode=null;if(r)r(v);}
function shakeLock(msg){haptic('error');const d=$('lockDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');if(msg)$('lockTitle').textContent=msg;}
function passKey(k){
  if(k==='cancel'){endLock(null);return;}
  if(k==='face'){doBioUnlock(false);return;}
  haptic();
  if(k==='del'){passBuf=passBuf.slice(0,-1);drawDots();return;}
  if(passBuf.length>=4)return;passBuf+=k;drawDots();
  if(passBuf.length===4)setTimeout(()=>{
    if(passMode==='unlock'){if(passBuf===settings.pass)endLock(true);else{passBuf='';drawDots();shakeLock('密碼錯誤，請再試一次');}}
    else if(passMode==='set'){
      if(passFirst===null){passFirst=passBuf;passBuf='';drawDots();$('lockTitle').textContent='再輸入一次確認';}
      else if(passFirst===passBuf){haptic('success');endLock(passBuf);}
      else{passFirst=null;passBuf='';drawDots();shakeLock('兩次不一樣，請重新輸入');}
    }
  },130);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return;}
  if(settings.pass&&!passMode&&hiddenAt&&Date.now()-hiddenAt>60000){passFlow('unlock');if(settings.bio&&settings.bioCred&&bioSupported())setTimeout(()=>doBioUnlock(true),350);}
});

/* ---------- Face ID / Touch ID（WebAuthn） ---------- */
function bioSupported(){return !!(window.isSecureContext&&navigator.credentials&&navigator.credentials.create&&navigator.credentials.get&&window.PublicKeyCredential!==undefined);}
function b64urlToBytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function toggleBio(on){
  if(on){
    if(!bioSupported()){toast('這個瀏覽器不支援 Face ID');return;}
    if(!settings.pass){toast('請先開啟密碼鎖');return;}
    if(settings.bioCred){settings.bio=true;saveSettings();toast('已開啟 Face ID 解鎖');return;}
    try{
      const ch=new Uint8Array(32);crypto.getRandomValues(ch);const u=new Uint8Array(16);crypto.getRandomValues(u);
      const cred=await navigator.credentials.create({publicKey:{challenge:ch,rp:{id:location.hostname,name:'我的記帳本'},
        user:{id:u,name:'my-ledger',displayName:'我的記帳本'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
      settings.bioCred=cred.id;settings.bio=true;saveSettings();haptic('success');toast('已開啟 Face ID 解鎖');
    }catch(e){toast('沒有開啟（已取消或裝置不支援）');}
  }else{settings.bio=false;settings.bioCred=null;saveSettings();toast('已關閉 Face ID 解鎖');}
}
async function doBioUnlock(silent){
  if(!settings.bioCred){if(!silent)toast('尚未設定 Face ID');return;}
  try{const ch=new Uint8Array(32);crypto.getRandomValues(ch);
    await navigator.credentials.get({publicKey:{challenge:ch,rpId:location.hostname,allowCredentials:[{type:'public-key',id:b64urlToBytes(settings.bioCred)}],userVerification:'required',timeout:60000}});
    if(passMode==='unlock')endLock(true);
  }catch(e){if(!silent){toast('Face ID 沒有通過');haptic('error');}}
}

/* ---------- 備份：優先用 iOS 分享面板（存到檔案、iCloud、AirDrop、LINE） ---------- */
function download(name,content,mime,bom){
  const blob=new Blob([bom?'﻿':'',content],{type:mime});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function shareOrDownload(name,content,mime,bom){
  try{
    const file=new File([bom?'﻿':'',content],name,{type:mime});
    if(!PREVIEW&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;}
  download(name,content,mime,bom);return true;
}

  if(ok){LS.set('ll_lastBackup',nowTs());toast('完整備份已匯出');refreshSettingsTop();}
}
async function exportCSV(){
  const d=D(),rows=d.tx.slice().sort((a,b)=>a.date.localeCompare(b.date));
  let csv='日期,名稱,分類,帳戶,類型,金額,備註\n';
  rows.forEach(r=>{const a=d.accounts.find(x=>x.id===r.account);
    csv+=[r.date,r.name,catName(r.category),a?a.name:'',r.type==='income'?'收入':'支出',r.amount,r.note||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')+'\n';});
  const ok=await shareOrDownload(`記帳_${book().name}_${today()}.csv`,csv,'text/csv;charset=utf-8',true);
  if(ok){LS.set('ll_lastBackup',nowTs());toast('CSV 已匯出');refreshSettingsTop();}
}
function readFile(input){return new Promise((res,rej)=>{const f=input.files&&input.files[0];if(!f)return rej(new Error('no-file'));const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(f,'utf-8');});}
function csvParse(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let cur=[''],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur[cur.length-1]+='"';i++;}else q=false;}else cur[cur.length-1]+=c;}
    else if(c==='"')q=true;else if(c===',')cur.push('');
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;rows.push(cur);cur=[''];}
    else cur[cur.length-1]+=c;}
  if(cur.length>1||cur[0]!=='')rows.push(cur);return rows;
}
async function importCSV(){
  let text;try{text=await readFile($('fileCSV'));}catch(e){return;}
  const rows=csvParse(text);if(rows.length<2){alertMsg('沒有可匯入的資料','這個 CSV 檔案裡沒有記錄。');return;}
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const idx=(...ks)=>head.findIndex(h=>ks.some(k=>h.includes(k)));
  const iDate=idx('date','日期')>=0?idx('date','日期'):0,iName=idx('name','名稱')>=0?idx('name','名稱'):1,iCat=idx('category','分類')>=0?idx('category','分類'):2;
  const iAmt=idx('amount','金額')>=0?idx('amount','金額'):3,iType=idx('type','類型')>=0?idx('type','類型'):(head.length>=6?4:-1);
  const iNote=idx('note','備註')>=0?idx('note','備註'):(head.length>=6?5:-1),iAcct=idx('帳戶','account');
  const d=D(),acct0=d.accounts[0]?d.accounts[0].id:'';let n=0;
  rows.slice(1).forEach(c=>{
    if(!c||!c[iDate])return;const date=c[iDate].trim().replace(/\//g,'-');if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(date))return;
    const [yy,mm,dd]=date.split('-');const nd=`${yy}-${pad2(mm)}-${pad2(dd)}`;
    const amt=Number(String(c[iAmt]||'').replace(/[^\d.-]/g,''));if(!amt)return;
    let type='expense';if(iType>=0){const tv=(c[iType]||'').trim();type=(tv==='income'||tv==='收入')?'income':'expense';}
    let cat=(c[iCat]||'其他').trim()||'其他';
    const cats=type==='income'?d.catsInc:d.catsExp;
    const found=cats.find(x=>x===cat||catName(x)===cat);
    if(found)cat=found;else{if(!cat.includes(' '))cat=(type==='income'?'💰 ':'🧾 ')+cat;cats.push(cat);}
    let aid=acct0;
    if(iAcct>=0&&c[iAcct]){let a=d.accounts.find(x=>x.name===c[iAcct].trim());if(!a){a={id:uid(),name:c[iAcct].trim(),icon:'💳',opening:0};d.accounts.push(a);}aid=a.id;}
    d.tx.push({id:uid(),date:nd,name:(c[iName]||catName(cat)).trim()||catName(cat),category:cat,amount:Math.abs(amt),type,account:aid,note:iNote>=0?(c[iNote]||'').trim():'',createdAt:nowTs()+n});n++;
  });
  saveDB();renderAll();haptic('success');toast(n?`已匯入 ${n} 筆到「${book().name}」`:'沒有找到可以匯入的記錄');
}
async function importJSON(){

  let pack;try{pack=JSON.parse(text);}catch(e){alertMsg('無法讀取','這不是正確的備份檔。');return;}

}

function checkAppUpdate(){
  if(PREVIEW){toast('預覽版不需要更新');return;}
  if(!('serviceWorker' in navigator)){location.reload();return;}
  toast('正在檢查更新…');
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(!reg){location.reload();return;}
    reg.update().then(()=>setTimeout(()=>{if(reg.waiting){toast('正在套用新版本…');reg.waiting.postMessage({type:'SKIP_WAITING'});}else toast('已經是最新版本');},900)).catch(()=>location.reload());
  }).catch(()=>location.reload());
}

/* ---------- 底部安全區（沿用 v1 對 iPhone 主畫面 App 的修正） ---------- */
function fitSafe(){
  try{const de=document.documentElement,ae=document.activeElement;
    if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
    const standalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
    const pr=document.createElement('div');pr.style.cssText='position:absolute;visibility:hidden;padding-bottom:env(safe-area-inset-bottom,0px)';document.body.appendChild(pr);
    const safe=parseFloat(getComputedStyle(pr).paddingBottom)||0;pr.remove();
    const gap=Math.max(screen.height,screen.width)-window.innerHeight;
    if(standalone&&window.innerHeight>window.innerWidth&&gap>=safe&&safe>0)de.style.setProperty('--sab','0px');else de.style.removeProperty('--sab');
  }catch(e){}
}
window.addEventListener('resize',fitSafe);window.addEventListener('pageshow',fitSafe);

  // 新增／編輯 sheet
  if((el=t.closest('#txSeg button'))){if(F.type!==el.dataset.v){F.type=el.dataset.v;const cats=F.type==='expense'?D().catsExp:D().catsInc;if(!cats.includes(F.cat))F.cat=suggestCat(F.type);F.dirty=true;haptic();renderTxSheet();}return;}
  if((el=t.closest('[data-cat]'))){F.cat=decodeURIComponent(el.dataset.cat);F.dirty=true;haptic();renderTxCats();renderAmount();bump(qs('.cat.on .b',$('txCats')));$('fName').placeholder=`名稱（留空用「${catName(F.cat)}」）`;if(document.activeElement===$('fName'))renderSugg();return;}
  if((el=t.closest('[data-key]'))){amtKey(el.dataset.key);return;}
  if(t.closest('#txAmount')){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();setKeypad(true);$('txSugg').innerHTML='';return;}
  if((el=t.closest('[data-sugg]'))){F.name=decodeURIComponent(el.dataset.sugg);$('fName').value=F.name;const c=decodeURIComponent(el.dataset.scat);const cats=F.type==='expense'?D().catsExp:D().catsInc;if(cats.includes(c))F.cat=c;
    if(!F.amt&&Number(el.dataset.samt)>0)F.amt=String(el.dataset.samt);F.dirty=true;haptic();renderTxCats();renderAmount();$('txSugg').innerHTML='';$('fName').blur();setKeypad(true);return;}
  if(t.closest('#txSave')){saveTx();return;}
  if(t.closest('#txCancel')){requestCloseSheet('txSheet');return;}
  if(t.closest('#txDelete')){const id=F.id;F.dirty=false;closeSheet('txSheet');setTimeout(()=>deleteTx(id),250);return;}
  // 密碼鍵盤
  if((el=t.closest('[data-pk]'))){passKey(el.dataset.pk);return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('[role="button"]')){e.target.click();}
  if($('txSheet').classList.contains('open')&&!$('txSheet').classList.contains('typing')){
    if(/^[0-9]$/.test(e.key))amtKey(e.key);else if(e.key==='.')amtKey('.');else if(e.key==='Backspace')amtKey('del');else if(e.key==='Enter')saveTx();
  }
  if(passMode&&/^[0-9]$/.test(e.key))passKey(e.key);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-toggle]');if(el){haptic();toggleSetting(el.dataset.toggle,el.checked,el);}});
$('q').addEventListener('input',e=>{listQuery=e.target.value;renderListBody();});
['fName','fNote'].forEach(id=>{
  $(id).addEventListener('focus',()=>{setKeypad(false);if(id==='fName')renderSugg();else $('txSugg').innerHTML='';});
  $(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();setKeypad(true);}});
});
$('fName').addEventListener('input',e=>{F.name=e.target.value;F.dirty=true;renderSugg();});
$('fNote').addEventListener('input',e=>{F.note=e.target.value;F.dirty=true;});
$('fDate').addEventListener('change',e=>{F.date=e.target.value||today();F.dirty=true;});
$('fAcct').addEventListener('change',e=>{F.acct=e.target.value;F.dirty=true;});
$('fDate').addEventListener('focus',()=>setKeypad(false));
$('fAcct').addEventListener('focus',()=>setKeypad(false));
async function chooseBook(){
  const i=await actionSheet({title:'切換帳本',actions:[...books.map(b=>({label:(b.id===activeId?'✓ ':'')+b.name})),{label:'管理帳本…'}]});
  if(i<0)return;
  if(i===books.length){switchTab('settings',true);while(setPages.length)popPage();pushPage('books');return;}
  const b=books[i];if(b&&b.id!==activeId){activeId=b.id;saveBooks();homeSel=null;stSel=null;renderAll();toast(`已切換到「${b.name}」`);}
}

/* =====================================================================
   啟動
   ===================================================================== */
(function boot(){
  initTheme();applyLook();applyMuted();applyWall();applyGlassLevel();applyNavGlass();fitSafe();setTimeout(fitSafe,400);
  if(settings.tilt)startTilt(false);
  saveSettings();
  qsa('#rangeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===stRange));
  switchTab('home',true);
  requestAnimationFrame(()=>{movePill(false);syncSegs();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{movePill(false);syncSegs();});
  if(settings.pass){passFlow('unlock');if(settings.bio&&settings.bioCred&&bioSupported())setTimeout(()=>doBioUnlock(true),350);}
  if(!PREVIEW){
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
      let refreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
    const last=LS.get('ll_lastBackup',0);
    if(!last)setTimeout(()=>toast('建議先匯出一次完整備份',{action:'備份',onAction:exportJSON,ms:6000}),1400);
    else if(nowTs()-last>30*86400000)setTimeout(()=>toast('超過 30 天沒備份了',{action:'備份',onAction:exportJSON,ms:6000}),1400);
  }else{
    setTimeout(()=>toast('預覽模式：示範資料，不會影響你手機上的記錄',{ms:3200}),600);
  }
})();

/* 所有可點的元件都給一下輕觸回饋；若這次點擊已經由程式觸發過（例如成功／錯誤的節奏），就不重複 */
document.addEventListener('click',e=>{
  if(!e.isTrusted||!settings.haptic)return;
  const t=e.target.closest&&e.target.closest('button,[role="button"],[role="tab"],[role="option"],.tap,.tab,.key,.chip,.pill,.cat,.sw,.wtile,label.switch,[data-key],[data-act],[data-go]');
  if(!t||t.disabled)return;
  if(Date.now()-_lastPulse<60)return;
  _pulse();
});
</script>
