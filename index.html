let IMP=null;
const impNorm=t=>String(t||'').toLowerCase().replace(/[\s\-_・·.()（）「」【】]/g,'').replace(/(信用卡|簽帳金融卡|簽帳卡|金融卡|帳戶|戶頭|銀行)$/,'');
function impDate(v){
  v=String(v||'').trim().replace(/[年月.]/g,'/').replace(/日/g,'').replace(/-/g,'/').split(/\s|T/)[0];
  let m=v.match(/^(\d{8})$/);if(m)v=`${m[1].slice(0,4)}/${m[1].slice(4,6)}/${m[1].slice(6)}`;
  m=v.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);let y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];if(y<1000)y+=1911;}
  else{m=v.match(/^(\d{1,2})\/(\d{1,2})$/);if(!m)return '';const t=new Date();y=t.getFullYear();mo=+m[1];d=+m[2];
    if(`${y}-${pad2(mo)}-${pad2(d)}`>ymd(addDays(t,31)))y--;}
  if(mo<1||mo>12||d<1||d>31||y<1970||y>2100)return '';
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
function impAmt(v){
  let t=String(v==null?'':v).trim();if(!t)return null;
  let neg=/^\(.*\)$/.test(t)||/-\s*$/.test(t)||/^-|^−/.test(t.replace(/^(nt\$|\$|twd)\s*/i,''));
  t=t.replace(/[^\d.]/g,'');if(!t)return null;const n=Number(t);if(!isFinite(n))return null;return neg?-n:n;
}
function impHeaderRow(rows){
  let best=-1,score=0;
  for(let i=0;i<Math.min(12,rows.length);i++){let sc=0;
    rows[i].forEach(h=>{const x=String(h).trim().toLowerCase();if(x&&Object.values(IMP_COLS).some(c=>c.k.some(k=>x===k||x.includes(k))))sc++;});
    if(sc>score){score=sc;best=i;}}
  return score>=2?best:-1;
}
function impAutoCols(head){
  const used=new Set(),cols={};
  for(const pass of [0,1])for(const f of Object.keys(IMP_COLS)){if(cols[f]!=null)continue;const c=IMP_COLS[f];
    for(const k of c.k){const i=head.findIndex((h,j)=>{if(used.has(j))return false;const x=String(h).trim().toLowerCase();if(c.no&&c.no.test(x))return false;return pass===0?x===k:x.includes(k);});
      if(i>=0){cols[f]=i;used.add(i);break;}}}
  return cols;
}
const INC_GUESS=[['薪水',/薪|salary|payroll/i],['獎金',/獎金|bonus/i],['投資',/股息|配息|股利|利息|基金|證券/],['紅包',/紅包/]];
function guessCat(name,type,d){
  const list=type==='income'?d.catsInc:d.catsExp,find=n=>list.find(c=>catName(c)===n);
  if(type==='income')for(const [n,re] of INC_GUESS)if(re.test(name)){const c=find(n);if(c)return c;}
  if(type==='expense')for(const [n,re] of CAT_GUESS)if(re.test(name)){const c=find(n);if(c)return c;}
  return find('其他')||list[list.length-1];
}
function impKindFromName(n){return acctKind({name:n});}
function impSuggest(name,d){
  const nn=impNorm(name);let best=null;
  d.accounts.forEach(a=>{const an=impNorm(a.name);if(!an||!nn)return;
    if(an===nn||an.includes(nn)||nn.includes(an)){if(!best||Math.abs(an.length-nn.length)<Math.abs(impNorm(best.name).length-nn.length))best=a;}});
  return best?'map:'+best.id:'new:'+impKindFromName(name);
}
async function importCSV(){
  const f=$('fileCSV').files&&$('fileCSV').files[0];
  let text;try{text=await readFile($('fileCSV'));}catch(e){return;}
  if(/\uFFFD/.test(text.slice(0,2000))&&f&&window.TextDecoder){try{text=new TextDecoder('big5').decode(await f.arrayBuffer());}catch(e){}}
  $('fileCSV').value='';
  const rows=csvParse(text).filter(r=>r.some(c=>String(c).trim()));
  if(rows.length<2){alertMsg('沒有可匯入的資料','這個 CSV 檔案裡沒有記錄。');return;}
  let hi=impHeaderRow(rows),head,cols;
  if(hi<0){hi=0;head=rows[0].map(String);cols={date:0,name:1,cat:2,amt:3,type:head.length>=6?4:null,note:head.length>=6?5:null};}
  else{head=rows[hi].map(h=>String(h).trim());cols=impAutoCols(head);}
  const d=D(),fname=(f&&f.name||'').replace(/\.csv$/i,'');
  let target=null;const fn=impNorm(fname);
  d.accounts.forEach(a=>{const an=impNorm(a.name);if(an&&fn.includes(an)&&(!target||an.length>impNorm(target.name).length))target=a;});
  const last=d.accounts.find(a=>a.id===settings.lastImportAcct);
  // 看檔案本身判斷是不是信用卡帳單（標題列、欄位名稱、小計行），不靠選了哪個帳戶
  const pre=rows.slice(0,hi).map(r=>r.join(' ')).join(' ')+' '+fname,body=rows.slice(hi+1);
  const isCard=cols.post!=null||/信用卡|卡號|消費明細|本期應繳|應繳總額|最低應繳/.test(pre+' '+head.join(' '))||body.some(r=>IMP_SKIP.test(r.join(' '))&&/應繳/.test(r.join(' ')));
  const hasBal=head.some(h=>/餘額/.test(h));
  if(!target&&isCard)target=d.accounts.find(a=>acctKind(a)==='credit')||null;
  if(!target&&last&&!(isCard&&acctKind(last)!=='credit'))target=last;
  IMP={head,body,cols,fname,isCard,sign:isCard||!hasBal?'out':'in',target:(target||d.accounts[0]||{}).id||'',map:{},catOver:{},dupOk:false};
  impBuild();renderImport();openSheet('importSheet');
}
function impAcctFor(row){
  const d=D(),c=IMP.cols;
  if(c.acct!=null&&String(row[c.acct]||'').trim()){const nm=String(row[c.acct]).trim();const ex=d.accounts.find(a=>a.name===nm);if(ex)return {id:ex.id,kind:acctKind(ex)};

    if(m==='skip')return {skip:true};if(m.startsWith('map:')){const a=d.accounts.find(x=>x.id===m.slice(4));return {id:a.id,kind:acctKind(a)};}
    return {newName:nm,kind:m.slice(4)};}

function impBuild(){
  const d=D(),c=IMP.cols,out=[],stat={sum:0,skipSum:0,bad:0,dup:0,pay:0,noAcct:0};
  IMP.signed=c.amt!=null&&c.type==null&&c.out==null&&c.inc==null;
  IMP.unknown={};
  IMP.body.forEach((r,ri)=>{
    const name=String(c.name!=null?r[c.name]||'':'').trim();
    const date=impDate(c.date!=null?r[c.date]:'');
    if(name&&IMP_SKIP.test(name)){stat.skipSum++;return;}
    let amt=null,type='expense';
    if(c.out!=null||c.inc!=null){const o=impAmt(c.out!=null?r[c.out]:null),i=impAmt(c.inc!=null?r[c.inc]:null);
      if(o)amt=Math.abs(o);else if(i){amt=Math.abs(i);type='income';}}
    else if(c.amt!=null)amt=impAmt(r[c.amt]);
    if(!date||!amt){if(String(r.join('')).trim())stat.bad++;return;}
    const ac=impAcctFor(r);if(ac.skip){stat.noAcct++;return;}
    let kind='tx';
    if(c.type!=null){const tv=String(r[c.type]||'').trim();type=/收入|income|存入/i.test(tv)?'income':'expense';amt=Math.abs(amt);}
    else if(c.out==null&&c.inc==null){
      const neg=amt<0;amt=Math.abs(amt);
      if(IMP.sign==='out'){if(neg){if(IMP_PAY.test(name)&&(IMP.isCard||ac.kind==='credit')){if(ac.kind!=='credit'){stat.payNoCard=(stat.payNoCard||0)+1;return;}kind='pay';}else type='income';}}
      else if(!neg)type='income';
    }
    let cat=null;
    if(kind==='tx'){
      const list=type==='income'?d.catsInc:d.catsExp,cv=c.cat!=null?String(r[c.cat]||'').trim():'';
      const nv=c.note!=null?(String(r[c.note]||'').match(/原(?:始)?(?:類別|分類)\s*[:：]\s*([^,，;；\s]+)/)||[])[1]:'';
      const orig=nv&&list.find(x=>catName(x)===nv);
      if(orig)cat=orig;
      else if(cv){cat=list.find(x=>x===cv||catName(x)===cv)||(cv.includes(' ')?cv:(type==='income'?'💰 ':'🧾 ')+cv);}
      else cat=guessCat(name,type,d);
      if(IMP.catOver[ri])cat=IMP.catOver[ri];
    }
    const post=c.post!=null?impDate(r[c.post]):'';
    const acctId=ac.id||null;
    const pa=kind==='pay'&&acctId?d.accounts.find(y=>y.id===acctId):null;
    const dup=(pa&&(pa.payments||[]).some(p=>p.date===date&&Math.abs(p.amount-amt)<0.01))||kind==='tx'&&acctId&&d.tx.some(x=>x.account===acctId&&x.date===date&&Math.abs(x.amount-amt)<0.01&&x.type===type&&(!name||!x.name||impNorm(x.name).includes(impNorm(name).slice(0,6))||impNorm(name).includes(impNorm(x.name).slice(0,6))));
    if(dup)stat.dup++;if(kind==='pay')stat.pay++;
    out.push({ri,date,post:post&&post!==date?post:'',name:name||(cat?catName(cat):'繳款'),amt:Math.round(amt*100)/100,type,kind,cat,ac,dup,
      note:c.note!=null?String(r[c.note]||'').trim():''});
  });
  IMP.rows=out;IMP.stat=stat;
}

   - 地獄：整個畫面擋住，只能記帳或「按住」今天沒花錢；要再拖得按越來越久，一天最多 3 次

function nagState(){
  const c=nagCfg(),now=new Date(),t=ymd(now);
  if(_nagPrev)return {c:Object.assign(c,{level:_nagPrev}),logged:false,missed:3,overMin:95,due:true,tier:3,snoozed:false,last:ymd(addDays(now,-4)),any:true};
  let last=ymd(addDays(parseD(c.since),-1)),any=false;
  for(const id in DB){const b=DB[id];if(!b||!b.tx)continue;
    for(const r of b.tx){any=true;if(r.date<=t&&r.date>last)last=r.date;
      if(r.createdAt){const cd=ymd(new Date(r.createdAt));if(cd<=t&&cd>last)last=cd;}}}
  (settings.nsDays||[]).forEach(d=>{if(d<=t&&d>last)last=d;});
  const logged=last===t,missed=logged?0:Math.max(0,Math.round((parseD(t)-parseD(last))/86400000)-1);
  const [hh,mm]=c.time.split(':').map(Number),overMin=now.getHours()*60+now.getMinutes()-(hh*60+mm);
  const due=c.on&&!logged&&(missed>=1||overMin>=0);

}

  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const url=location.origin+location.pathname.replace(/[^/]*$/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//my-ledger//nag//ZH-TW','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:記帳提醒'];
  const ev=(i,st,title)=>{L.push('BEGIN:VEVENT',`UID:my-ledger-nag-${i}@${location.host||'local'}`,'DTSTAMP:'+stamp,'DTSTART:'+f(st),'DTEND:'+f(new Date(st.getTime()+5*60000)),
    'RRULE:FREQ=DAILY','SUMMARY:'+title,'DESCRIPTION:記帳提醒：打開記帳本記一筆 '+url,'URL:'+url,'TRANSP:TRANSPARENT',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title,'TRIGGER:PT0S','END:VALARM','END:VEVENT');};
  plan.forEach((m,i)=>ev(i,new Date(base.getTime()+m*60000),T[i]));
  if(c.level==='hell'){const mo=new Date();mo.setHours(8,30,0,0);ev(9,mo,'昨天的帳記好了嗎？');}
  L.push('END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
async function nagCalendar(){
  const ok=await shareOrDownload('記帳提醒.ics',nagICS(),'text/calendar',false);
  if(ok)alertMsg('加入行事曆','如果出現分享面板：選「儲存到檔案」，再打開「檔案」App 點這個檔案，按「全部加入」。\n如果直接出現行事曆畫面：按「全部加入」就好。');
}

(function boot(){
  initTheme();applyLook();applyMuted();applyWall();applyGlassLevel();applyNavGlass();fitSafe();setTimeout(fitSafe,400);
  if(settings.tilt)startTilt(false);
  saveSettings();
  qsa('#rangeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===stRange));
  switchTab('home',true);
  setTimeout(nagTick,1500);
  requestAnimationFrame(()=>{movePill(false);syncSegs();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{movePill(false);syncSegs();});
  if(settings.pass){passFlow('unlock');if(settings.bio&&settings.bioCred&&bioSupported())setTimeout(()=>doBioUnlock(true),350);}
  if(!PREVIEW){
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
      let refreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
    const last=LS.get('ll_lastBackup',0);
    if(!last)setTimeout(()=>toast('建議先匯出一次完整備份',{action:'備份',onAction:exportJSON,ms:6000}),1400);
    else if(nowTs()-last>30*86400000)setTimeout(()=>toast('超過 30 天沒備份了',{action:'備份',onAction:exportJSON,ms:6000}),1400);
  }else{
    setTimeout(()=>toast('預覽模式：示範資料，不會影響你手機上的記錄',{ms:3200}),600);
  }
})();

/* 觸覺回饋（iOS 26.5 起只認「手指真的點在包著 switch 的 label 上」）：
   每個可點的元件裡都常駐一個透明 label，裡面包一個隱藏的 <input switch>。手指點下去 → iOS 視為真的切換 switch → 震一下；
   點擊照樣冒泡給按鈕本身；轉發給 switch 的那次點擊在 switch 上就攔下，按鈕不會被觸發兩次。 */
const HAP_SEL='button,[role="button"],[role="tab"],[role="option"],.tap,.key,.chip,.pill,.cat,.wtile,[data-key],[data-act],[data-go],[data-open],[data-cat-open],[data-edit],[data-del]';
const HAP_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
var _hapAt=0;
function hapOverlay(el){
  if(!el||el.nodeType!==1||el.disabled)return;
  if(el.matches('input,textarea,select,label,option')||el.closest('label,select,.hap-ov'))return;
  if(el.querySelector(':scope>.hap-ov'))return;
  if(el.querySelector('input:not([type=checkbox]):not([type=radio]),textarea,select'))return;   // 裡面有輸入框的不蓋，免得點不到
  const l=document.createElement('label');l.className='hap-ov';l.setAttribute('aria-hidden','true');
  const sw=document.createElement('input');sw.type='checkbox';sw.setAttribute('switch','');sw.tabIndex=-1;sw.setAttribute('aria-hidden','true');
  sw.addEventListener('click',e=>e.stopPropagation());sw.addEventListener('change',e=>e.stopPropagation());
  sw.addEventListener('input',e=>e.stopPropagation());
  l.appendChild(sw);
  if(getComputedStyle(el).position==='static')el.classList.add('hap-rel');
  el.appendChild(l);
}
function hapScan(root){
  if(!HAP_TOUCH||!root||root.nodeType!==1)return;
  if(root.matches(HAP_SEL))hapOverlay(root);
  root.querySelectorAll(HAP_SEL).forEach(hapOverlay);
}
function applyHapticSetting(){document.documentElement.toggleAttribute('data-nohap',!settings.haptic);}
if(HAP_TOUCH){
  let pend=new Set(),raf=0;
  new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1&&!n.classList.contains('hap-ov'))pend.add(n);
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;const a=[...pend];pend.clear();a.forEach(n=>{if(n.isConnected)hapScan(n);});});
  }).observe(document.body,{childList:true,subtree:true});
  hapScan(document.body);
  document.addEventListener('pointerdown',e=>{if(e.target&&e.target.classList&&e.target.classList.contains('hap-ov'))_hapAt=Date.now();},true);
}
applyHapticSetting();
