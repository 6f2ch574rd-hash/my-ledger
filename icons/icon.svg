<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C65D77"/>
      <stop offset="1" stop-color="#9E203E"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C65D77"/>
      <stop offset="1" stop-color="#B24A68"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DC96"/>
      <stop offset="1" stop-color="#E0AE50"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="180" rx="112" fill="rgba(255,255,255,0.08)"/>
  <rect x="138" y="134" width="272" height="294" rx="30" fill="rgba(0,0,0,0.15)"/>
  <rect x="130" y="120" width="272" height="294" rx="32" fill="#FFFDF9"/>
  <rect x="130" y="120" width="42" height="294" rx="21" fill="url(#spine)"/>
  <rect x="172" y="120" width="3" height="294" fill="rgba(158,32,62,0.22)"/>
  <!-- 兩條橫線 -->
  <rect x="202" y="176" width="150" height="16" rx="8" fill="#C65D77"/>
  <rect x="202" y="222" width="110" height="12" rx="6" fill="#F5C451"/>
  <!-- $：微縮右移，四周留白不碰任何東西 -->
