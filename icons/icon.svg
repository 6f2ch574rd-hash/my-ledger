  <!-- 金條堆：1/3 跨出帳本右緣 -->
  <rect x="313" y="362" width="64" height="40" rx="7" fill="#C0882C"/>
  <rect x="313" y="357" width="64" height="35" rx="7" fill="url(#bar)"/>
  <rect x="383" y="362" width="64" height="40" rx="7" fill="#C0882C"/>
  <rect x="383" y="357" width="64" height="35" rx="7" fill="url(#bar)"/>
  <rect x="347" y="316" width="64" height="40" rx="7" fill="#C0882C"/>
  <rect x="347" y="311" width="64" height="35" rx="7" fill="url(#bar)"/>
